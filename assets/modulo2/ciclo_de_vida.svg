<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo de vida e caminho de uma requisição</title>
  <desc id="desc">Na inicialização o lifespan carrega o modelo uma vez; cada requisição passa pela validação Pydantic, pelas regras de negócio e pela inferência em memória, retornando 200, 422, 400, 500 ou 503.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop stop-color="#0b2036"/><stop offset="1" stop-color="#286879"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b2036" flood-opacity=".13"/></filter>
    <marker id="seta" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 14 7 0 14Z" fill="#21485f"/></marker>
    <marker id="setaR" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 14 7 0 14Z" fill="#c2410c"/></marker>
    <style>
      .heading{font:750 30px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.subheading{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#c7dce1}
      .t{font:750 16px Inter,Segoe UI,Arial,sans-serif;fill:#102a3e}.tw{font:750 16px Inter,Segoe UI,Arial,sans-serif;fill:#fff}
      .s{font:500 13px Inter,Segoe UI,Arial,sans-serif;fill:#52606d}.sw{font:500 13px Inter,Segoe UI,Arial,sans-serif;fill:#c7dce1}
      .lane{font:750 15px Inter,Segoe UI,Arial,sans-serif;fill:#21485f}.code{font:700 14px Consolas,Menlo,monospace}
      .f{fill:none;stroke:#21485f;stroke-width:3;marker-end:url(#seta)}.e{fill:none;stroke:#c2410c;stroke-width:2.5;stroke-dasharray:6 5;marker-end:url(#setaR)}
    </style>
  </defs>
  <rect width="1500" height="640" rx="24" fill="#f6f9fb"/>
  <rect width="1500" height="96" rx="24" fill="url(#header)"/><rect y="72" width="1500" height="24" fill="url(#header)"/>
  <text x="54" y="43" class="heading">Ciclo de vida e caminho de uma requisição</text>
  <text x="54" y="70" class="subheading">O disco é lido só na subida; cada requisição usa o pipeline que já está na memória RAM</text>

  <text x="40" y="140" class="lane">INICIALIZAÇÃO (uma vez)</text>
  <g filter="url(#shadow)">
    <rect x="40" y="156" width="250" height="84" rx="14" fill="#0f4c64"/>
    <rect x="330" y="156" width="250" height="84" rx="14" fill="#0f4c64"/>
    <rect x="620" y="156" width="250" height="84" rx="14" fill="#0f4c64"/>
    <rect x="910" y="156" width="250" height="84" rx="14" fill="#0f4c64"/>
    <rect x="1200" y="156" width="260" height="84" rx="14" fill="#21485f"/>
  </g>
  <text x="165" y="192" text-anchor="middle" class="tw">uvicorn sobe a app</text><text x="165" y="214" text-anchor="middle" class="sw">FastAPI(lifespan=lifespan)</text>
  <text x="455" y="192" text-anchor="middle" class="tw">joblib.load (1×)</text><text x="455" y="214" text-anchor="middle" class="sw">modelo_imobiliario_v2.joblib</text>
  <text x="745" y="192" text-anchor="middle" class="tw">aquecimento</text><text x="745" y="214" text-anchor="middle" class="sw">1 predição de exemplo</text>
  <text x="1035" y="192" text-anchor="middle" class="tw">app.state</text><text x="1035" y="214" text-anchor="middle" class="sw">servico_modelo em RAM</text>
  <text x="1330" y="192" text-anchor="middle" class="tw">yield → atende</text><text x="1330" y="214" text-anchor="middle" class="sw">no desligamento: descarregar()</text>
  <path class="f" d="M290 198 H322"/><path class="f" d="M580 198 H612"/><path class="f" d="M870 198 H902"/><path class="f" d="M1160 198 H1192"/>

  <text x="40" y="300" class="lane">CADA REQUISIÇÃO  POST /v1/predict</text>
  <g filter="url(#shadow)">
    <rect x="40" y="316" width="250" height="90" rx="14" fill="#fff" stroke="#d5e1e8"/>
    <rect x="330" y="316" width="250" height="90" rx="14" fill="#fff" stroke="#d5e1e8"/>
    <rect x="620" y="316" width="250" height="90" rx="14" fill="#fff" stroke="#d5e1e8"/>
    <rect x="910" y="316" width="250" height="90" rx="14" fill="#fff" stroke="#d5e1e8"/>
    <rect x="1200" y="316" width="260" height="90" rx="14" fill="#e8f7f0" stroke="#1baf7a"/>
  </g>
  <text x="165" y="352" text-anchor="middle" class="t">JSON do cliente</text><text x="165" y="374" text-anchor="middle" class="s">corpo da requisição</text>
  <text x="455" y="352" text-anchor="middle" class="t">Pydantic (schemas)</text><text x="455" y="374" text-anchor="middle" class="s">tipos · faixas · campos extras</text>
  <text x="745" y="352" text-anchor="middle" class="t">router → service</text><text x="745" y="374" text-anchor="middle" class="s">regras de negócio</text>
  <text x="1035" y="352" text-anchor="middle" class="t">pipeline.predict</text><text x="1035" y="374" text-anchor="middle" class="s">modelo já em memória</text>
  <text x="1330" y="352" text-anchor="middle" class="t" style="fill:#0f766e">200 OK</text><text x="1330" y="374" text-anchor="middle" class="s">PrevisaoSaida + faixa provável</text>
  <path class="f" d="M290 361 H322"/><path class="f" d="M580 361 H612"/><path class="f" d="M870 361 H902"/><path class="f" d="M1160 361 H1192"/>

  <g filter="url(#shadow)">
    <rect x="330" y="470" width="250" height="110" rx="14" fill="#fff5ef" stroke="#f0b08a"/>
    <rect x="620" y="470" width="250" height="110" rx="14" fill="#fff5ef" stroke="#f0b08a"/>
    <rect x="910" y="470" width="250" height="110" rx="14" fill="#fff5ef" stroke="#f0b08a"/>
    <rect x="1200" y="470" width="260" height="110" rx="14" fill="#fff5ef" stroke="#f0b08a"/>
  </g>
  <text x="455" y="504" text-anchor="middle" class="code" style="fill:#c2410c">422</text><text x="455" y="528" text-anchor="middle" class="s">texto em número, fora da faixa,</text><text x="455" y="548" text-anchor="middle" class="s">campo ausente ou desconhecido</text>
  <text x="745" y="504" text-anchor="middle" class="code" style="fill:#c2410c">400</text><text x="745" y="528" text-anchor="middle" class="s">porão ≥ área útil, reforma</text><text x="745" y="548" text-anchor="middle" class="s">inválida, CEP fora da base</text>
  <text x="1035" y="504" text-anchor="middle" class="code" style="fill:#c2410c">503</text><text x="1035" y="528" text-anchor="middle" class="s">modelo fora da memória</text><text x="1035" y="548" text-anchor="middle" class="s">(/health mostra o estado)</text>
  <text x="1330" y="504" text-anchor="middle" class="code" style="fill:#c2410c">500</text><text x="1330" y="528" text-anchor="middle" class="s">erro inesperado: JSON limpo,</text><text x="1330" y="548" text-anchor="middle" class="s">a API não cai</text>
  <path class="e" d="M455 406 V462"/><path class="e" d="M745 406 V462"/><path class="e" d="M1035 406 V462"/><path class="e" d="M1330 406 V462"/>
  <text x="40" y="500" class="t">Respostas de erro</text>
  <text x="40" y="524" class="s">formato único em erros.py:</text>
  <text x="40" y="546" class="s">{"erro", "mensagem", "detalhes"}</text>
</svg>
