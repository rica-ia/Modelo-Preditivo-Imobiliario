<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Estrutura do projeto Modelo Preditivo Imobiliário</title>
  <desc id="desc">Mapa das bases de dados, notebook, código-fonte, modelo, painel geoespacial, resultados e documentação.</desc>
  <defs>
