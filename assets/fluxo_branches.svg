<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo das branches do projeto</title>
  <desc id="desc">A branch develop deriva da main, a branch experiment/modelos deriva da develop para comparar modelos e retorna por merge sem fast-forward somente após validação.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop stop-color="#0b2036"/><stop offset="1" stop-color="#286879"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b2036" flood-opacity=".13"/></filter>
    <marker id="navyArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#21485f"/></marker>
    <marker id="goldArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b08d57"/></marker>
    <style>
      .heading{font:750 30px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.subheading{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#c7dce1}
      .lane{font:750 16px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.card{font:750 15px Inter,Segoe UI,Arial,sans-serif;fill:#102a3e}.small{font:500 12px Inter,Segoe UI,Arial,sans-serif;fill:#667085}.note{font:650 13px Inter,Segoe UI,Arial,sans-serif;fill:#725b35}
      .mainline{fill:none;stroke:#21485f;stroke-width:4;stroke-linecap:round;marker-end:url(#navyArrow)}
      .experiment{fill:none;stroke:#b08d57;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#goldArrow)}
      .dashed{fill:none;stroke:#91a4b4;stroke-width:2;stroke-dasharray:7 7}
    </style>
  </defs>
  <rect width="1500" height="720" rx="24" fill="#f6f9fb"/>
  <rect width="1500" height="96" rx="24" fill="url(#header)"/><rect y="72" width="1500" height="24" fill="url(#header)"/>
  <text x="54" y="43" class="heading">Fluxo de versionamento</text>
  <text x="54" y="70" class="subheading">A experimentação ocorre fora da linha de entrega e só retorna após superar o baseline</text>

  <rect x="34" y="128" width="182" height="108" rx="15" fill="#0b2036"/><text x="125" y="176" text-anchor="middle" class="lane">main</text><text x="125" y="199" text-anchor="middle" class="small" style="fill:#b9d0d5">versão estável</text>
  <rect x="34" y="296" width="182" height="108" rx="15" fill="#21485f"/><text x="125" y="344" text-anchor="middle" class="lane">develop</text><text x="125" y="367" text-anchor="middle" class="small" style="fill:#c7dce1">integração das fases</text>
  <rect x="34" y="492" width="182" height="108" rx="15" fill="#8a6a3d"/><text x="125" y="536" text-anchor="middle" class="lane" style="font-size:14px">experiment/modelos</text><text x="125" y="560" text-anchor="middle" class="small" style="fill:#f3e7d2">comparação isolada</text>

  <path d="M216 182H426" class="mainline"/>
  <path d="M330 182V350H426" class="mainline"/>
  <path d="M426 350H1385" class="mainline"/>
  <path d="M1385 350V182H1402" class="mainline"/>

  <g transform="translate(252 138)"><rect width="174" height="88" rx="13" fill="#fff" stroke="#c7dce1"/><text x="87" y="36" text-anchor="middle" class="card">main inicial</text><text x="87" y="60" text-anchor="middle" class="small">estrutura mínima</text></g>
  <g transform="translate(428 306)"><rect width="190" height="88" rx="13" fill="#fff" stroke="#c7dce1"/><text x="95" y="36" text-anchor="middle" class="card">Preparação</text><text x="95" y="60" text-anchor="middle" class="small">ambiente + base bruta</text></g>
  <g transform="translate(662 306)"><rect width="190" height="88" rx="13" fill="#fff" stroke="#c7dce1"/><text x="95" y="36" text-anchor="middle" class="card">Fases 1–4</text><text x="95" y="60" text-anchor="middle" class="small">EDA até preparação</text></g>

  <circle cx="892" cy="350" r="9" fill="#b08d57"/>
  <path d="M892 359V536H930" class="experiment"/>
  <g transform="translate(930 492)"><rect width="190" height="88" rx="13" fill="#fffaf3" stroke="#d8bd8d" stroke-width="2"/><text x="95" y="30" text-anchor="middle" class="card">Comparação</text><text x="95" y="51" text-anchor="middle" class="small">Linear · HGB · HGB Log</text><text x="95" y="70" text-anchor="middle" class="small">GroupKFold · 5 folds</text></g>
  <path d="M1120 536H1135V362" class="experiment"/>
  <circle cx="1135" cy="350" r="10" fill="#b08d57" stroke="#fff" stroke-width="3"/>
  <text x="1044" y="626" class="note">merge --no-ff somente após validação</text>
  <path d="M1038 603H1264" class="dashed"/>

  <g transform="translate(1150 306)"><rect width="150" height="88" rx="13" fill="#fff" stroke="#c7dce1"/><text x="75" y="29" text-anchor="middle" class="card">Fase 6</text><text x="75" y="51" text-anchor="middle" class="small">avaliação + modelo v1</text><text x="75" y="70" text-anchor="middle" class="small">documentação</text></g>
  <g transform="translate(1310 306)"><rect width="150" height="88" rx="13" fill="#fff" stroke="#c7dce1"/><text x="75" y="29" text-anchor="middle" class="card">Validação final</text><text x="75" y="51" text-anchor="middle" class="small">benchmark no Colab</text><text x="75" y="70" text-anchor="middle" class="small">sanitização</text></g>
  <g transform="translate(1312 138)"><rect width="152" height="88" rx="13" fill="#0f3046" stroke="#d8bd8d" stroke-width="2"/><text x="76" y="35" text-anchor="middle" class="card" style="fill:#fff">main final</text><text x="76" y="59" text-anchor="middle" class="small" style="fill:#c7dce1">merge --no-ff</text></g>

  <g transform="translate(252 646)"><circle cx="8" cy="8" r="6" fill="#b08d57"/><text x="24" y="13" class="small">Se o experimento não superar o baseline de forma consistente, a branch não é integrada.</text></g>
</svg>
